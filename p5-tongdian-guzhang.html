<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>交流电流回路调试 · 升流异常逐层定位</title>
<style>
:root{--blue:#0B3D91;--orange:#F5A623;--green:#2E7D32;--red:#C62828;--ink:#2B2F36;--bg:#F5F7FA;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{background:linear-gradient(135deg,#0B3D91,#1a56b8);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border:10px solid rgba(255,255,255,.10);border-radius:50%}
header h1{margin:0;font-size:21px}
header p{margin:7px 0 0;font-size:13px;opacity:.88}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.pill{background:#fff;border:1px solid #dfe5ee;border-radius:999px;padding:4px 13px}
.pill b{color:var(--blue)}
.prog{height:7px;background:#e6ecf5;border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0B3D91,#2E7D32);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(11,61,145,.08)}
.hint{background:#FFF7E6;border-left:4px solid var(--orange);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 24px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.center{text-align:center}
.pop{display:none;margin-top:14px;border-radius:8px;padding:13px 15px;font-size:14px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pop.ok{display:block;background:#EDF7EE;border-left:4px solid var(--green)}
.pop.no{display:block;background:#FDECEC;border-left:4px solid var(--red)}
.pop .src{display:block;margin-top:6px;font-size:12.5px;color:#5a6472}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.glow{animation:glow .7s ease-out 2}
.end{display:none}
.score{font-size:38px;color:var(--blue);font-weight:700;margin:8px 0}
.note{margin-top:24px;font-size:12px;color:#6b7280;border-top:1px dashed #d7dee8;padding-top:10px}

.scene{background:#FFFBF2;border-left:4px solid var(--orange);padding:12px 15px;border-radius:0 8px 8px 0;margin-bottom:16px;font-size:14px}
.path{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;min-height:32px}
.hop{background:#e8eefb;color:var(--blue);border-radius:999px;padding:4px 12px;font-size:12.5px;animation:pop .3s}
.opts{display:grid;gap:11px}
.opt{background:#fff;border:2px solid #dfe5ee;border-radius:9px;padding:14px 16px;font-size:14px;cursor:pointer;transition:.16s;position:relative}
.opt:hover{border-color:var(--blue);transform:translateX(4px);box-shadow:0 3px 10px rgba(11,61,145,.13)}
.opt.good{border-color:var(--green);background:#EDF7EE}
.opt.waste{border-color:var(--red);background:#FDECEC;animation:shake .35s}
.opt .cost{position:absolute;right:12px;top:12px;font-size:11.5px;color:#8b95a5}
.opt.disabled{pointer-events:none;opacity:.5}
.acts{display:flex;gap:10px;margin-top:16px}
</style></head><body><div class="wrap">
<header><h1>交流电流回路调试 · 升流异常逐层定位</h1><p>项目5 二次回路调试 ｜ 5.3 交流电流回路调试 ｜ 故障定位推理（约 5 分钟）</p></header>
<div class="bar"><span class="pill">步数 <b id="prog">0</b></span><span class="pill">得分 <b id="score">0</b></span><span class="pill">走过弯路 <b id="waste">0</b></span></div>
<div class="prog"><i id="progbar"></i></div>
<div class="card">
  <p class="hint">玩法：按逻辑一步步收窄范围。每次选择都写明了「这一步花多久」。走错路会浪费时间，但不扣光分。</p>
  <div class="scene" id="scene"></div>
  <div class="path" id="path"></div>
  <div class="opts" id="opts"></div>
  <div class="pop" id="pop"></div>
  <div class="acts"><button class="btn ghost" id="restart">重来</button></div>
</div>
<div class="card end" id="done"><div class="center"><div class="score" id="final">0</div><p id="comment"></p><button class="btn" id="again" style="margin-top:10px">再练一次</button></div></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》任务 5.2（交流电流回路调试）；DL/T 995-2016 第 5.3.2.4/5.3.2.2 条；《110kV线路间隔继电保护验收方法》CT一次升流检查表。本页作课堂练习，不作考核依据。</div>
</div><script>
var TREE={"start": "n1", "_win": "win", "nodes": {"n1": {"text": "对 CT 一次升流，三相二次电流表都没有读数。装置采样也是零。", "opts": [{"t": "先查电流回路连片是否已恢复、末端是否已可靠短接", "to": "n2", "cost": "2分钟", "good": true, "why": "升流前最高的发错就是连片未恢复。技术工程中电流回路未接入运行设备时，要在回路最末端短接并做好安全措施。", "src": "企业口径：常规变电站220kV母联分段间隔继电保护现场验收指引（2025年版）附表2 检查说明"}, {"t": "先换一块电流表再试", "to": "n1", "cost": "10分钟", "good": false, "why": "三相同时为零，不可能是三块表一起坏。", "src": "----"}, {"t": "先拆开装置插件检查采样板", "to": "n1", "cost": "30分钟", "good": false, "why": "三相全零且表计也无读数，是回路断，不是装置采样坏。", "src": "----"}]}, "n2": {"text": "连片已恢复、末端短接也正常。升流后表计有电流，但装置采样三相都是零。", "opts": [{"t": "查试验电流是否真的通过了 CT 二次绕组（用钳型表卡在二次回路确认）", "to": "n3", "cost": "3分钟", "good": true, "why": "表计有数但装置为零，先确定电流是否流过装置所在的那一段。", "src": "出版稿任务5.2「升流检查的判据落在装置侧采样」"}, {"t": "直接改装置定值", "to": "n2", "cost": "20分钟", "good": false, "why": "定值不解决回路断线。", "src": "----"}, {"t": "把装置重启一次", "to": "n2", "cost": "15分钟", "good": false, "why": "重启不会把断掉的回路接上。", "src": "----"}]}, "n3": {"text": "钳型表显示试验电流确实流过了二次回路，但装置侧端子排上量不到电流。", "opts": [{"t": "沿回路查端子排，找断开的连片、松脱的端子或压错位置的接线", "to": "n4", "cost": "5分钟", "good": true, "why": "电流能到回路却到不了装置，断点在两者之间。", "src": "出版稿任务5.2「逐段核对接线与端子」"}, {"t": "怀疑 CT 变比错了", "to": "n3", "cost": "20分钟", "good": false, "why": "变比错影响的是量值大小，不会让装置侧完全没有电流。", "src": "----"}]}, "n4": {"text": "找到一处连片仍在断开位置。恢复后升流，装置采样三相都有数了。但其中一相读数比其他两相明显偏小。", "opts": [{"t": "查这一相绕组的极性是否接反、是否接成了别的组", "to": "n5", "cost": "4分钟", "good": true, "why": "单相偏小且其余正常，指向这一相自己的绕组与极性。用短接法可确认装置接的是不是这一组：短接该组极性端与非极性端，采样应归零。", "src": "DL/T 995-2016；出版稿任务5.2「短接判极性法」"}, {"t": "把这一相的表换掉", "to": "n4", "cost": "10分钟", "good": false, "why": "装置里也偏小，不是表的问题。", "src": "----"}]}, "n5": {"text": "确认该相绕组接错了组别。改正后三相电流平衡，装置采样与理论值一致。", "opts": [{"t": "做收尾：复查绝缘、恢复接线、记录数据并交代遗留问题", "to": "_win", "cost": "5分钟", "good": true, "why": "通过升流检查后的电流回路如有变动，应再做一次本试验；工作结束恢复接线、拆临时线、压板复位。", "src": "DL/T 995-2016；GB 26860-2011"}, {"t": "数据对了就能收工", "to": "n5", "cost": "0分钟", "good": false, "why": "回路动过不复测，通流的结论就不再覆盖它。", "src": "DL/T 995-2016"}]}}};   // {start:"n1", nodes:{n1:{text:"现象", opts:[{t:"选项", to:"n2", cost:"2分钟", good:true, why:"", src:""}]}}, win:"n9", winText:"定位到了"}
var cur="start", steps=0, score=0, waste=0, visited=[];

function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok?880:180; o.type = ok?'sine':'square';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(ok?.08:.12,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.22:.30));
    o.start(); o.stop(ac.currentTime+(ok?.24:.32));
  }catch(e){}
}
function setProg(p){ var b=$('#progbar'); if(b) b.style.width=Math.max(0,Math.min(100,p))+'%'; }
function setScore(s){ var e=$('#score'); if(e) e.textContent=s; }
function showPop(ok,html,src){
  var p=$('#pop'); p.className='pop '+(ok?'ok':'no');
  p.innerHTML='<b>'+(ok?'✔ 对了':'✘ 不对')+'</b><br>'+html+(src?'<span class="src">依据：'+src+'</span>':'');
}

function goto(id){
  cur=id;
  if(id==='_win'){ finish(); return; }
  var n=TREE.nodes[id];
  if(!n){ finish(); return; }
  $('#scene').innerHTML='<b>现在的情况：</b>'+n.text;
  var O=$('#opts'); O.innerHTML='';
  n.opts.forEach(function(o){
    var d=document.createElement('div'); d.className='opt';
    d.innerHTML=o.t+'<span class="cost">'+o.cost+'</span>';
    d.addEventListener('click',function(){ choose(o, d); });
    O.appendChild(d);
  });
}
function choose(o, el){
  steps++;
  $('#prog').textContent=steps;
  if(o.good){
    beep(true); el.classList.add('good');
    score+=20; setScore(score);
    visited.push(o.t);
    var P=$('#path');
    var h=document.createElement('span'); h.className='hop'; h.textContent=o.t; P.appendChild(h);
    setProg(Math.min(100, steps*25));
    showPop(true,o.why||'这一步是对的方向。',o.src||'');
    setTimeout(function(){ goto(o.to); },700);
  } else {
    beep(false); el.classList.add('waste');
    waste++; $('#waste').textContent=waste;
    score=Math.max(0, score-5); setScore(score);
    showPop(false,(o.why||'这条路不对，白跑一趟。')+'（浪费 '+o.cost+'）',o.src||'');
    setTimeout(function(){ el.classList.remove('waste'); el.classList.add('disabled'); },600);
  }
}
function finish(){
  $('.card').style.display='none'; $('#done').style.display='block';
  $('#final').textContent=score+' 分';
  var best=Math.max(0, 100-waste*5);
  $('#comment').textContent = waste===0
    ? '一次没走弯路，'+steps+' 步定位。这就是现场要的思路。'
    : '走了 '+waste+' 条弯路。'+(TREE.lesson||'排故的关键是先分清「哪些现象同时存在」，从最能一刀切分的那一处查起。');
  setProg(100);
}
$('#restart').onclick=function(){
  cur='start'; steps=0; score=0; waste=0;
  setScore(0); setProg(0); $('#prog').textContent='0'; $('#waste').textContent='0';
  $('#path').innerHTML=''; $('#done').style.display='none'; $('.card').style.display='block';
  goto('start');
};
$('#again').onclick=$('#restart').onclick;
goto('start');
</script></body></html>
