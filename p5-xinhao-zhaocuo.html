<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>信号回路调试 · 后台对点找错</title>
<style>
:root{--blue:#0B3D91;--orange:#F5A623;--green:#2E7D32;--red:#C62828;--ink:#2B2F36;--bg:#F5F7FA;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{background:linear-gradient(135deg,#0B3D91,#1a56b8);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border:10px solid rgba(255,255,255,.10);border-radius:50%}
header h1{margin:0;font-size:21px}
header p{margin:7px 0 0;font-size:13px;opacity:.88}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.pill{background:#fff;border:1px solid #dfe5ee;border-radius:999px;padding:4px 13px}
.pill b{color:var(--blue)}
.prog{height:7px;background:#e6ecf5;border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0B3D91,#2E7D32);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(11,61,145,.08)}
.hint{background:#FFF7E6;border-left:4px solid var(--orange);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 24px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.center{text-align:center}
.pop{display:none;margin-top:14px;border-radius:8px;padding:13px 15px;font-size:14px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pop.ok{display:block;background:#EDF7EE;border-left:4px solid var(--green)}
.pop.no{display:block;background:#FDECEC;border-left:4px solid var(--red)}
.pop .src{display:block;margin-top:6px;font-size:12.5px;color:#5a6472}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.glow{animation:glow .7s ease-out 2}
.end{display:none}
.score{font-size:38px;color:var(--blue);font-weight:700;margin:8px 0}
.note{margin-top:24px;font-size:12px;color:#6b7280;border-top:1px dashed #d7dee8;padding-top:10px}

.scene{position:relative;background:#F7FAFE;border:2px solid #d7e2f0;border-radius:10px;padding:18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:9px 11px;border:2px solid transparent;border-radius:7px;font-size:13.5px;cursor:pointer;transition:.16s;margin-bottom:6px}
.row:hover{background:#EEF4FF;border-color:#c3d6f5}
.row.found{background:#FDECEC;border-color:var(--red);cursor:default}
.row.found .tag{background:var(--red);color:#fff}
.row.correct-glow{background:#EDF7EE;border-color:var(--green)}
.row.miss{animation:shake .35s}
.tag{flex:0 0 auto;font-size:11px;background:#e8eefb;color:var(--blue);border-radius:4px;padding:2px 7px;font-family:monospace}
.txt{flex:1}
.hit{color:var(--red);font-weight:700}
</style></head><body><div class="wrap">
<header><h1>信号回路调试 · 后台对点找错</h1><p>项目5 二次回路调试 ｜ 5.6 信号回路调试 ｜ 找错点击（约 4 分钟）</p></header>
<div class="bar"><span class="pill">找到 <b id="prog">0 / 8</b></span><span class="pill">得分 <b id="score">0</b></span><span class="pill">满分 <b>80</b></span><span class="pill">剩余 <b id="left">3</b></span></div>
<div class="prog"><i id="progbar"></i></div>
<div class="card">
  <p class="hint" id="hintText">玩法：下面这份图面里藏着 8 处错误，用鼠标点出来。点错了会扣分。</p>
  <div class="scene" id="scene"></div>
  <div class="pop" id="pop"></div>
  <div style="margin-top:14px"><button class="btn ghost" id="restart">重来</button></div>
</div>
<div class="card end" id="done"><div class="center"><div class="score" id="final">0</div><p id="comment"></p><button class="btn" id="again" style="margin-top:10px">再练一次</button></div></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》任务 5.5（信号回路调试）；DL/T 1879-2018 第 8.5.1.5/8.5.1.9 条 b) 款；DL/T 5136-2012 第 5.2.1 条；DL/T 995-2016。本页作课堂练习，不作考核依据。</div>
</div><script>
var ROWS=[{"tag": "X-01", "text": "按对点检测表逐条核对，每个信号点与设计图一一对应", "bad": false, "wrong": "这条是对的。对点表的作用就是查漏。"}, {"tag": "X-02", "text": "遥信变位后在后台只要求数值变化，不要求着色与闪烁", "bad": true, "why": "监控主机显示的遥信状态应与输入状态一致，且变位后正确启动告警、状态变位着色、闪烁。", "src": "DL/T 1879-2018 第 8.5.1.5 条 b) 款"}, {"tag": "X-03", "text": "远方复归后只看后台光字是否复归，装置侧告警可不管", "bad": true, "why": "监控主机上相应的光字牌或告警信号应复归，装置上相应的告警信号也应复归——两头都得掉。", "src": "DL/T 1879-2018 第 8.5.1.9 条 b) 款"}, {"tag": "X-04", "text": "软报文采用逐个单独发出的方式，核对时标与内容", "bad": false, "wrong": "这条是对的。逐条发才能发现丢报文或时标不对。"}, {"tag": "X-05", "text": "重要信号只用通信软报文上传，不做硬接线", "bad": true, "why": "重要的信号应通过硬接线方式实现。硬接点与软报文是两条物理独立的路，一条通了不证明另一条也通。", "src": "DL/T 5136-2012 第 5.2.1 条"}, {"tag": "X-06", "text": "保护装置发出的信号既有软报文，也有硬接点经测控屏转数字信号上传", "bad": false, "wrong": "这条是对的，两条路都要验。"}, {"tag": "X-07", "text": "只在监控后台一处核对信号，不到测控装置与机构箱汇控箱核对", "bad": true, "why": "三处（监控后台、测控装置、机构箱汇控箱）应同时核对，只看一处容易漏判。", "src": "出版稿任务5.5「三处同时核对」"}, {"tag": "X-08", "text": "试验记录只记合格项，不记不合格项与遗留问题", "bad": true, "why": "清点试验记录应无漏试项目，试验数据、结论应完整、正确。只记合格项等于掩盖问题。", "src": "GB/T 50976-2014 第 8.1.3 条"}];   // [{tag:"A411", text:"...", bad:true, why:"", src:"", wrong:"这里是对的"}]
var LVL=10, found=0, score=0, lives=3, total=0;

function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok?880:180; o.type = ok?'sine':'square';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(ok?.08:.12,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.22:.30));
    o.start(); o.stop(ac.currentTime+(ok?.24:.32));
  }catch(e){}
}
function setProg(p){ var b=$('#progbar'); if(b) b.style.width=Math.max(0,Math.min(100,p))+'%'; }
function setScore(s){ var e=$('#score'); if(e) e.textContent=s; }
function showPop(ok,html,src){
  var p=$('#pop'); p.className='pop '+(ok?'ok':'no');
  p.innerHTML='<b>'+(ok?'✔ 对了':'✘ 不对')+'</b><br>'+html+(src?'<span class="src">依据：'+src+'</span>':'');
}

function render(){
  var S=$('#scene'); S.innerHTML='';
  found=0; score=0; lives=3; setScore(0); setProg(0);
  total=ROWS.filter(function(r){return r.bad;}).length;
  $('#done').style.display='none'; $('.card').style.display='block';
  $('#hintText').textContent='玩法：下面这份图面里藏着 '+total+' 处错误，用鼠标点出来。点错了会扣分。';
  $('#left').textContent=lives;
  var sh=shuffle(ROWS.map(function(r,i){return i;}));
  sh.forEach(function(i){
    var r=ROWS[i];
    var d=document.createElement('div'); d.className='row';
    d.innerHTML='<span class="tag">'+(r.tag||'')+'</span><span class="txt">'+r.text+'</span>';
    d.dataset.idx=i;
    d.addEventListener('click',function(){ tap(d, i); });
    S.appendChild(d);
  });
  $('#prog').textContent='0 / '+total;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function tap(el, i){
  if(el.classList.contains('found')) return;
  var r=ROWS[i];
  if(r.bad){
    beep(true);
    el.classList.add('found');
    el.querySelector('.txt').innerHTML='<span class="hit">✘ '+r.text+'</span>';
    found++; score+=LVL; setScore(score); setProg(100*found/total);
    $('#prog').textContent=found+' / '+total;
    showPop(true,'找对了。'+r.why,r.src);
    if(found===total) setTimeout(finish,700);
  } else {
    beep(false);
    lives--; $('#left').textContent=lives;
    el.classList.add('miss');
    setTimeout(function(){ el.classList.remove('miss'); },400);
    showPop(false,'这里没问题。'+(r.wrong||''),r.src||'');
    if(lives<=0){
      $$('.row').forEach(function(x){ if(ROWS[parseInt(x.dataset.idx,10)].bad) x.classList.add('correct-glow'); });
      showPop(false,'机会用完了。红色高亮的就是该点出来的错误。','');
      setTimeout(finish,1400);
    }
  }
}
function finish(){
  $('.card').style.display='none'; $('#done').style.display='block';
  $('#final').textContent=score+' 分';
  $('#comment').textContent = (found===total)?'全找出来了。这双眼睛可以上现场了。':'还差 '+(total-found)+' 处没找到。看看高亮的都是什么问题。';
}
$('#restart').onclick=render; $('#again').onclick=render;
render();
</script></body></html>
