<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>电气闭锁回路调试 · 闭锁条件装到正确位置</title>
<style>
:root{--blue:#0B3D91;--orange:#F5A623;--green:#2E7D32;--red:#C62828;--ink:#2B2F36;--bg:#F5F7FA;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{background:linear-gradient(135deg,#0B3D91,#1a56b8);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border:10px solid rgba(255,255,255,.10);border-radius:50%}
header h1{margin:0;font-size:21px}
header p{margin:7px 0 0;font-size:13px;opacity:.88}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.pill{background:#fff;border:1px solid #dfe5ee;border-radius:999px;padding:4px 13px}
.pill b{color:var(--blue)}
.prog{height:7px;background:#e6ecf5;border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0B3D91,#2E7D32);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(11,61,145,.08)}
.hint{background:#FFF7E6;border-left:4px solid var(--orange);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 24px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.center{text-align:center}
.pop{display:none;margin-top:14px;border-radius:8px;padding:13px 15px;font-size:14px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pop.ok{display:block;background:#EDF7EE;border-left:4px solid var(--green)}
.pop.no{display:block;background:#FDECEC;border-left:4px solid var(--red)}
.pop .src{display:block;margin-top:6px;font-size:12.5px;color:#5a6472}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.glow{animation:glow .7s ease-out 2}
.end{display:none}
.score{font-size:38px;color:var(--blue);font-weight:700;margin:8px 0}
.note{margin-top:24px;font-size:12px;color:#6b7280;border-top:1px dashed #d7dee8;padding-top:10px}

.stage{position:relative;background:#F0F4FB;border:2px dashed #c3d0e4;border-radius:10px;padding:16px;min-height:220px}
.stage-title{font-size:13px;color:#5a6472;margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{position:relative;min-height:64px;border:2px dashed #b9c7db;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#8b95a5;transition:.2s;padding:6px;text-align:center}
.slot.over{border-color:var(--orange);background:#FFF9EE;transform:scale(1.03)}
.slot.filled{border-style:solid;border-color:var(--green);background:#EDF7EE;color:var(--ink)}
.slot.hint{color:#b04a4a;border-color:#e8b4b4}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;min-height:70px;padding:10px;background:#fff;border-radius:8px;border:1px solid #e4ebf4}
.chip{cursor:grab;background:linear-gradient(180deg,#fff,#f4f7fc);border:2px solid #c3d0e4;border-radius:8px;padding:9px 13px;font-size:13px;transition:.18s;user-select:none;position:relative}
.chip:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 4px 10px rgba(11,61,145,.16)}
.chip.dragging{opacity:.45;transform:scale(.96)}
.chip.placed{opacity:.35;pointer-events:none;border-color:var(--green)}
.chip.bad{animation:shake .35s;border-color:var(--red);background:#FDECEC}
</style></head><body><div class="wrap">
<header><h1>电气闭锁回路调试 · 闭锁条件装到正确位置</h1><p>项目5 二次回路调试 ｜ 5.7 电气闭锁回路调试 ｜ 拖拽拼装（约 4 分钟）</p></header>
<div class="bar"><span class="pill">已装 <b id="prog">0 / 6</b></span><span class="pill">得分 <b id="score">0</b></span><span class="pill">满分 <b>60</b></span></div>
<div class="prog"><i id="progbar"></i></div>
<div class="card">
  <p class="hint">玩法：把下方散落的部件，用鼠标拖到上方对应的空位里。拖对了会吸附并变绿，拖错了会弹回去。</p>
  <div class="stage"><div class="stage-title" id="stageTitle"></div><div class="slots" id="slots"></div></div>
  <div class="pool" id="pool"></div>
  <div class="pop" id="pop"></div>
  <div style="margin-top:14px"><button class="btn ghost" id="restart">重来</button></div>
</div>
<div class="card end" id="done"><div class="center"><div class="score" id="final">0</div><p id="comment"></p><button class="btn" id="again" style="margin-top:10px">再练一次</button></div></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》任务 5.6（电气闭锁回路调试）；GB/T 45906.8-2025；DL/T 995-2016；GB/T 50976-2014。本页仅作课堂练习，不作考核依据。</div>
</div><script>
var ITEMS=[{"slot": "就地合闸回路", "chip": "隔离开关辅助接点（任一侧合位即闭锁）", "why": "任一侧刀闸置合位后就地合闸，结果应是断路器拒动——闭锁接在合闸回路上。", "src": "出版稿任务5.6「本间隔闭锁条件清单」", "wrong": "这条闭锁断的是别的电源，装这里合闸就闭不住了。"}, {"slot": "合闸回路", "chip": "弹簧未储能接点", "why": "未储能接点串在合闸回路里，没储能就不许合。", "src": "出版稿任务5.6「闭锁条件逐条核对」", "wrong": "接到跳闸回路上，会在最需要跳闸的时刻切断跳闸电源。"}, {"slot": "分闸回路（合位时）", "chip": "SF₆ 压力低闭锁接点", "why": "断路器在合位、压力达闭锁门槛时，动作是告警或断开分闸回路。", "src": "企业口径：继电保护验收指引（广东常规）附录 B 1.3", "wrong": "合位工况下压力异常防的是误跳，闭的是分闸侧。"}, {"slot": "刀闸操作机构", "chip": "断路器位置辅助接点", "why": "电气闭锁回路应直接使用断路器、隔离开关、接地开关等设备的辅助接点。", "src": "GB/T 45906.8-2025", "wrong": "这里要的是能直接判断设备位置的那副接点。"}, {"slot": "母差保护开入", "chip": "刀闸位置重动接点（至母线保护）", "why": "母差保护刀闸位置开入属接口回路，要用重动接点向外部装置提供位置。", "src": "出版稿任务5.6「接口回路清单」", "wrong": "接口回路与闭锁回路判据不同，别装混。"}, {"slot": "信号回路", "chip": "闭锁动作告警接点", "why": "闭锁动作要发告警，让运行人员知道操作被拒的原因。", "src": "出版稿任务5.6「闭锁动作的告警」", "wrong": "这是信号，不进操作回路。"}];   // [{slot:"空位名", chip:"部件名", why:"", src:"", wrong:""}]
var COLS=2;
var LVL=10, done=0, score=0, dragIdx=null;

function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok?880:180; o.type = ok?'sine':'square';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(ok?.08:.12,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.22:.30));
    o.start(); o.stop(ac.currentTime+(ok?.24:.32));
  }catch(e){}
}
function setProg(p){ var b=$('#progbar'); if(b) b.style.width=Math.max(0,Math.min(100,p))+'%'; }
function setScore(s){ var e=$('#score'); if(e) e.textContent=s; }
function showPop(ok,html,src){
  var p=$('#pop'); p.className='pop '+(ok?'ok':'no');
  p.innerHTML='<b>'+(ok?'✔ 对了':'✘ 不对')+'</b><br>'+html+(src?'<span class="src">依据：'+src+'</span>':'');
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function render(){
  done=0; score=0; setScore(0); setProg(0); $('#done').style.display='none'; $('.card').style.display='block';
  $('#stageTitle').textContent='把部件拖到对应位置';
  var S=$('#slots'), P=$('#pool'); S.innerHTML=''; P.innerHTML='';
  ITEMS.forEach(function(it,i){
    var s=document.createElement('div'); s.className='slot'; s.dataset.idx=i;
    s.innerHTML='<span>'+it.slot+'</span>';
    s.addEventListener('dragover',function(e){ e.preventDefault(); s.classList.add('over'); });
    s.addEventListener('dragleave',function(){ s.classList.remove('over'); });
    s.addEventListener('drop',function(e){
      e.preventDefault(); s.classList.remove('over');
      if(dragIdx===null) return;
      try{ drop(dragIdx, i, s); }catch(x){}
    });
    S.appendChild(s);
  });
  shuffle(ITEMS.map(function(it,i){return i;})).forEach(function(i){
    var c=document.createElement('div'); c.className='chip'; c.draggable=true; c.dataset.idx=i;
    c.textContent=ITEMS[i].chip;
    c.addEventListener('dragstart',function(e){ dragIdx=i; c.classList.add('dragging'); try{e.dataTransfer.setData('text/plain',String(i));}catch(x){} });
    c.addEventListener('dragend',function(){ c.classList.remove('dragging'); });
    // 触屏兜底：点选
    c.addEventListener('click',function(){
      if(c.classList.contains('placed')) return;
      window.__selIdx=i;
      $$('.chip').forEach(function(x){ x.style.outline=''; });
      c.style.outline='3px solid var(--orange)';
      showPop(false,'已选中「'+ITEMS[i].chip+'」，现在点上方对应的空位。');
    });
    P.appendChild(c);
  });
  $$('.slot').forEach(function(s){
    s.addEventListener('click',function(){
      if(window.__selIdx===undefined||window.__selIdx===null) return;
      drop(window.__selIdx, parseInt(s.dataset.idx,10), s);
    });
  });
  $('#prog').textContent='0 / '+ITEMS.length;
}
function drop(chipIdx, slotIdx, slotEl){
  var it=ITEMS[chipIdx];
  if(slotEl.classList.contains('filled')) return;
  if(chipIdx===slotIdx){
    beep(true);
    slotEl.classList.add('filled'); slotEl.classList.add('glow');
    slotEl.innerHTML='<span>'+it.chip+'</span>';
    var c=$$('.chip').filter(function(x){return parseInt(x.dataset.idx,10)===chipIdx;})[0];
    if(c){ c.classList.add('placed'); c.style.outline=''; }
    done++; score+=LVL; setScore(score); setProg(100*done/ITEMS.length);
    $('#prog').textContent=done+' / '+ITEMS.length;
    showPop(true,it.why||'位置正确。',it.src||'');
    window.__selIdx=null;
    if(done===ITEMS.length) finish();
  } else {
    beep(false);
    slotEl.classList.add('bad');
    setTimeout(function(){ slotEl.classList.remove('bad'); },420);
    showPop(false,(it.wrong||'这个部件不属于这里。')+(ITEMS[slotIdx]?'<br>这个位置要的是：'+ITEMS[slotIdx].chip:''),it.src||'');
    window.__selIdx=null;
  }
}
function finish(){
  setTimeout(function(){
    $('.card').style.display='none'; $('#done').style.display='block';
    $('#final').textContent=score+' 分';
    $('#comment').textContent = score>=36?'过关。部件与位置的对应关系记住了。':'没过 36 分。把错的再想一遍，然后重来。';
  },650);
}
$('#restart').onclick=render; $('#again').onclick=render;
render();
</script></body></html>
