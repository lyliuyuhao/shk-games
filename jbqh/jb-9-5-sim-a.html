<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>9.5 整组传动 · 仿真 · 虚拟仿真</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#eef4fb;color:#0b2545;padding:16px}
.wrap{max-width:1000px;margin:0 auto}
header{background:linear-gradient(120deg,#07263F,#0d4a73 60%,#1F7FC0);color:#fff;border-radius:14px;
  padding:14px 20px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
header h1{font-size:18px}header .sub{font-size:12.5px;opacity:.9;margin-top:3px}
.hud{margin-left:auto;display:flex;gap:16px;font-size:13px;font-weight:700}
.hud b{font-size:18px;color:#FFD479}
.card{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:0 2px 10px rgba(11,37,69,.08);margin-bottom:14px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;font-size:13px}
.meta div b{color:#1a56b8}
.scene{background:#f7fafd;border-left:3px solid #1F7FC0;padding:12px 14px;border-radius:8px;font-size:14px;line-height:1.75}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.opt{border:1.5px solid #cfe0f5;border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
.opt:hover{border-color:#1F7FC0;transform:translateX(2px)}
.opt.bad{background:#fef2f2;border-color:#b91c1c}
.opt.good{background:#ecfdf5;border-color:#059669}
.log{margin-top:12px;font-size:13px;line-height:1.7}
.log div{padding:7px 10px;border-radius:8px;margin-bottom:6px}
.log .ok{background:#f0fdf4;color:#065f46;border-left:3px solid #059669}
.log .no{background:#fef2f2;color:#7f1d1d;border-left:3px solid #b91c1c}
.bar{height:8px;background:#e3ecf7;border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#0F7B6C,#F5A623);width:0;transition:.3s}
button{border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#0B3D91;color:#fff}
.rule{font-size:12.5px;color:#41576e;line-height:1.8}
.veto{background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:10px 14px;font-size:13px;color:#7f1d1d;margin-top:8px}
</style></head><body><div class="wrap">
<header><svg width="46" height="46" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="46" fill="#fff" opacity=".16"/>
<path d="M18 46a32 32 0 0 1 64 0z" fill="#F5A623"/><circle cx="50" cy="56" r="24" fill="#ffe0bd"/>
<circle cx="41" cy="53" r="3" fill="#0b2545"/><circle cx="59" cy="53" r="3" fill="#0b2545"/>
<path d="M42 64q8 6 16 0" stroke="#0b2545" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
<div><h1>9.5 整组传动 · 仿真</h1><div class="sub">图文分支仿真 · 每次选择都会产生后果</div></div>
<div class="hud"><div>步骤 <b id="st">1</b>/<b id="tot">1</b></div><div>总分 <b id="sc">100</b></div></div></header>

<div class="card">
  <div class="meta">
    <div><b>场景</b><br>线路保护屏与断路器，整组传动</div>
    <div><b>设备与初始状态</b><br>安措已执行，跳合闸回路已按票断开并登记，重合闸方式已核对</div>
    <div><b>目标结果</b><br>模拟故障→保护动作→跳闸→重合→信号与 SOE 核对，防跳有效，恢复闭环</div>
  </div>
</div>

<div class="card">
  <div class="scene" id="scene"></div>
  <div class="opts" id="opts"></div>
  <div class="bar"><i id="pg"></i></div>
  <div class="log" id="log"></div>
</div>

<div class="card">
  <div class="rule"><b>判分规则：</b>初始 100 分；每步错误按扣分表扣分；<b>触发任一否决项即本次 0 分</b>；完成全部正确步骤按剩余分计。
  <div class="veto" id="veto"></div></div>
  <div style="margin-top:12px"><button onclick="restart()">重新开始</button></div>
</div>
</div>
<script>
const SIM = {"steps": [{"scene": "传动前先确认？", "options": [{"t": "直接加故障量", "ok": false, "pen": 20, "veto": true, "fb": "安措未登记即传动，可能直接跳运行设备。"}, {"t": "确认安措已执行并登记待恢复项", "ok": true, "fb": "先保安全，再谈动作。"}]}, {"scene": "核对运行值班员操作的把手与连片。", "options": [{"t": "跳过，反正不归我管", "ok": false, "pen": 10, "fb": "把手及连片的连线、名称、位置标号是否正确是整组试验必查项（§5.3.7.5 e）。"}, {"t": "逐项核对连线、名称、位置标号与设计一致", "ok": true, "fb": "运行人员据此操作，标号错就是隐患。"}]}, {"scene": "模拟故障后，断路器正确跳闸。接着？", "options": [{"t": "结束，记录跳闸即可", "ok": false, "pen": 10, "fb": "还要验重合、信号与 SOE。"}, {"t": "验重合闸按方式动作，再核对信号与 SOE 的内容、顺序、时标", "ok": true, "fb": "三项（跳合闸/信号/SOE）齐才算整组。"}]}, {"scene": "SOE 里缺了「重合闸动作」。", "options": [{"t": "少一条无所谓", "ok": false, "pen": 15, "veto": true, "fb": "SOE 完整性是整组三项判据之一，缺项＝不合格。"}, {"t": "判不合格，查信号回路与记录功能", "ok": true, "fb": "查清才算完成。"}]}, {"scene": "验证防跳回路。", "options": [{"t": "不验，装置自带", "ok": false, "pen": 15, "fb": "防跳须实测：合闸后持续跳闸命令不应反复跳跃。"}, {"t": "合闸后施加持续跳闸命令，确认可靠跳闸且不反复跳跃", "ok": true, "fb": "防跳有效，设备才不被反复冲击。"}]}, {"scene": "恢复阶段。", "options": [{"t": "直接恢复接线", "ok": false, "pen": 15, "veto": true, "fb": "恢复接线前须测交流回路直流电阻（§5.3.7.9）。"}, {"t": "测交流回路直流电阻→恢复接线→信号全部复归→复验压板位置", "ok": true, "fb": "闭环恢复正常。"}]}], "vetoes": ["安措未执行即传动", "SOE 缺项仍判合格", "恢复前未测交流回路直流电阻"]};
let i = 0, score = 100, vetoed = false;
document.getElementById('tot').textContent = SIM.steps.length;
document.getElementById('veto').innerHTML = '否决项：' + SIM.vetoes.map((v,k)=>(k+1)+'. '+v).join('　');

function render(){
  if(vetoed || i >= SIM.steps.length){ finish(); return; }
  const s = SIM.steps[i];
  document.getElementById('st').textContent = i+1;
  document.getElementById('scene').innerHTML = s.scene;
  document.getElementById('opts').innerHTML = s.options.map((o,k)=>
    '<div class="opt" data-k="'+k+'" onclick="choose('+k+')">'+o.t+'</div>').join('');
  document.getElementById('pg').style.width = (i/SIM.steps.length*100)+'%';
}
function choose(k){
  const s = SIM.steps[i], o = s.options[k], box = document.querySelector('.opt[data-k="'+k+'"]');
  const log = document.getElementById('log');
  if(o.ok){
    box.classList.add('good');
    log.insertAdjacentHTML('beforeend','<div class="ok">✅ '+o.fb+'</div>');
    i++;
    setTimeout(render, 550);
  } else {
    box.classList.add('bad');
    score -= (o.pen || 10);
    if(o.veto){ vetoed = true; }
    log.insertAdjacentHTML('beforeend','<div class="no">❌ '+o.fb+(o.veto?'　【触发否决项，本次 0 分】':'　（−'+(o.pen||10)+' 分）')+'</div>');
    if(vetoed){ setTimeout(finish, 700); } else { setTimeout(()=>box.classList.remove('bad'), 600); }
  }
  document.getElementById('sc').textContent = vetoed ? 0 : Math.max(score,0);
}
function finish(){
  document.getElementById('opts').innerHTML = '';
  document.getElementById('pg').style.width = '100%';
  const final = vetoed ? 0 : Math.max(score, 0);
  document.getElementById('scene').innerHTML = '<b>仿真结束</b>　得分：<b style="font-size:20px;color:'+
    (final>=60?'#047857':'#b91c1c')+'">'+final+'</b> / 100　'+
    (vetoed ? '<span style="color:#b91c1c">（触发否决项）</span>' : (final>=60?'通过':'未通过（<60）'));
  document.getElementById('sc').textContent = final;
  document.getElementById('log').insertAdjacentHTML('beforeend',
    '<div class="ok">回传数据项：完成时长、错误步骤序列、否决触发、最终状态（用于学情分析）</div>');
}
function restart(){ i=0; score=100; vetoed=false; document.getElementById('log').innerHTML='';
  document.getElementById('sc').textContent=100; render(); }
render();
</script></body></html>
