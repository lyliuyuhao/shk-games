<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《电力系统二次回路》教学游戏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#08152b;color:#eaf1ff;
  min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 18% 12%,rgba(58,130,255,.22),transparent 42%),
             radial-gradient(circle at 84% 84%,rgba(255,168,60,.16),transparent 46%)}
.wrap{position:relative;z-index:2;max-width:720px;padding:40px 22px;text-align:center}
h1{font-size:30px;letter-spacing:1.6px;line-height:1.4;
  background:linear-gradient(92deg,#8ec2ff,#ffd479 58%,#ff9e7d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(120,180,255,.42))}
.sub{font-size:14px;color:#8aa6cd;margin-top:14px;line-height:1.9}
.big{display:inline-flex;align-items:center;gap:10px;margin-top:32px;text-decoration:none;
  font-size:18px;font-weight:800;color:#08152b;letter-spacing:.6px;
  background:linear-gradient(96deg,#ffd479,#ffb454);padding:18px 40px;border-radius:14px;
  box-shadow:0 14px 38px rgba(255,180,84,.36);transition:.18s}
.big:hover{transform:translateY(-3px);box-shadow:0 20px 46px rgba(255,180,84,.5)}
.card{background:linear-gradient(160deg,#16294a,#0f1f38);border:1.5px solid rgba(120,170,255,.24);
  border-radius:14px;padding:20px 22px;margin-top:34px;text-align:left}
.card h2{font-size:14px;color:#ffd479;letter-spacing:.6px;margin-bottom:12px}
.card ol{margin:0;padding-left:20px;font-size:13px;color:#a9c2e2;line-height:2.1}
.card ol b{color:#eaf1ff}
.note{font-size:12px;color:#7d94b5;margin-top:22px;line-height:1.9}
.note b{color:#ffd479}
</style>
</head>
<body>
<div class="wrap">
  <h1>《电力系统二次回路》<br>教学游戏</h1>
  <div class="sub">游戏不再预置，全部由老师用配置器现做现出。<br>选玩法 → 交资料 → 预览 → 导出一个单文件，可脱机投屏，也可挂到课程平台。</div>

  <a class="big" href="editor.html">🛠 打开教学游戏配置器</a>

  <div class="card">
    <h2>怎么用</h2>
    <ol>
      <li><b>选玩法</b> —— 13 种可用，每种都写明「需要你提供什么资料」</li>
      <li><b>交资料</b> —— 传图（自动内嵌）／在图上打点／批量粘贴文字</li>
      <li><b>预览</b> —— 学生视角试玩一遍</li>
      <li><b>导出</b> —— 得到单文件 HTML，发我即可上线挂平台</li>
    </ol>
  </div>

  <div class="note">
    如页面显示异常，请按 <b>Ctrl + F5</b> 强制刷新一次。<br>
    教学练习用，不作考核依据。
  </div>
</div>
</body>
</html>
