<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>操作电源回路调试 · 限值调一调</title>
<style>
:root{--blue:#0B3D91;--orange:#F5A623;--green:#2E7D32;--red:#C62828;--ink:#2B2F36;--bg:#F5F7FA;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{background:linear-gradient(135deg,#0B3D91,#1a56b8);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border:10px solid rgba(255,255,255,.10);border-radius:50%}
header h1{margin:0;font-size:21px}
header p{margin:7px 0 0;font-size:13px;opacity:.88}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.pill{background:#fff;border:1px solid #dfe5ee;border-radius:999px;padding:4px 13px}
.pill b{color:var(--blue)}
.prog{height:7px;background:#e6ecf5;border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0B3D91,#2E7D32);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(11,61,145,.08)}
.hint{background:#FFF7E6;border-left:4px solid var(--orange);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 24px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.center{text-align:center}
.pop{display:none;margin-top:14px;border-radius:8px;padding:13px 15px;font-size:14px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pop.ok{display:block;background:#EDF7EE;border-left:4px solid var(--green)}
.pop.no{display:block;background:#FDECEC;border-left:4px solid var(--red)}
.pop .src{display:block;margin-top:6px;font-size:12.5px;color:#5a6472}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.glow{animation:glow .7s ease-out 2}
.end{display:none}
.score{font-size:38px;color:var(--blue);font-weight:700;margin:8px 0}
.note{margin-top:24px;font-size:12px;color:#6b7280;border-top:1px dashed #d7dee8;padding-top:10px}

.qa{background:#F0F4FB;border-left:4px solid var(--blue);padding:11px 14px;border-radius:0 7px 7px 0;font-size:14px;margin-bottom:16px}
.zone{position:relative;height:46px;margin:26px 0 8px;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#FDECEC 0%,#FDECEC 50%,#EDF7EE 50%,#EDF7EE 100%)}
.zone .mark{position:absolute;top:0;bottom:0;width:3px;background:var(--red);opacity:.55}
.zone .thumb{position:absolute;top:-13px;width:26px;height:26px;background:#fff;border:3px solid var(--blue);border-radius:50%;transform:translateX(-50%);transition:left .05s linear;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.zone .val{position:absolute;bottom:-30px;transform:translateX(-50%);font-size:13.5px;font-weight:700;color:var(--blue)}
input[type=range]{width:100%;margin:0}
.scale{display:flex;justify-content:space-between;font-size:12.5px;color:#6b7280;margin-top:30px}
.acts{display:flex;gap:10px;margin-top:18px}
</style></head><body><div class="wrap">
<header><h1>操作电源回路调试 · 限值调一调</h1><p>项目5 二次回路调试 ｜ 5.8 操作电源回路调试 ｜ 数值调节（约 4 分钟）</p></header>
<div class="bar"><span class="pill">进度 <b id="prog">0 / 4</b></span><span class="pill">得分 <b id="score">0</b></span><span class="pill">满分 <b>40</b></span></div>
<div class="prog"><i id="progbar"></i></div>
<div class="card">
  <p class="hint">玩法：拖动滑块把数值调到判据要求的范围里。绿色区是合格区，越界会报红。</p>
  <div class="qa" id="q"></div>
  <div class="zone" id="zone"><div class="thumb" id="thumb"></div><div class="val" id="curval"></div></div>
  <input type="range" id="rng" min="0" max="100" step="1">
  <div class="scale" id="scale"></div>
  <div class="pop" id="pop"></div>
  <div class="acts"><button class="btn" id="ok">确认这个值</button><button class="btn ghost" id="restart">重来</button></div>
</div>
<div class="card end" id="done"><div class="center"><div class="score" id="final">0</div><p id="comment"></p><button class="btn" id="again" style="margin-top:10px">再练一次</button></div></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》任务 5.7（操作电源回路调试）；GB/T 14285-2023 第 8.8.2 条；DL/T 724-2021。本页仅作课堂练习，不作考核依据。</div>
</div><script>
var QS=[{"q": "直流母线纹波系数限值", "ask": "把母线纹波系数调到合格区", "min": 0, "max": 10, "step": 0.1, "lo": 0, "hi": 2, "unit": "%", "why": "纹波系数不大于 2%，电压在额定值 85%～110%。", "src": "GB/T 14285-2023 第 8.8.2 条", "wrong": "母线纹波限值是 2%，不是 5%。"}, {"q": "浮充电压（单体）", "ask": "把阀控蓄电池浮充电压调到推荐区间", "min": 2.0, "max": 2.5, "step": 0.01, "lo": 2.23, "hi": 2.28, "unit": "V", "why": "（2.23～2.28）V×N；均充才是 2.30～2.35。", "src": "DL/T 724-2021 第 6.2.2.1 条 a) 款", "wrong": "这是均充的值；浮充是 2.23～2.28V。"}, {"q": "新安装蓄电池三次循环后的容量要求", "ask": "三次充放电循环后容量至少达到额定容量的多少？", "min": 50, "max": 110, "step": 1, "lo": 100, "hi": 110, "unit": "%", "why": "三次充放电循环达不到额定容量判不合格。", "src": "DL/T 724-2021 第 5.3.1.2 条", "wrong": "新安装要三次循环达到额定容量，不是 80%。"}, {"q": "运行中核容的换组判据", "ask": "运行中三次全容量核对性放电达不到多少就判使用年限已到？", "min": 50, "max": 100, "step": 1, "lo": 80, "hi": 100, "unit": "%", "why": "运行中三次全容量核对性放电达不到 80% 判使用年限已到。", "src": "DL/T 724-2021 第 7.4.1.2.2 条", "wrong": "运行中是 80% 这条线。"}];
var LVL=10, i=0, score=0;

function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok?880:180; o.type = ok?'sine':'square';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(ok?.08:.12,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.22:.30));
    o.start(); o.stop(ac.currentTime+(ok?.24:.32));
  }catch(e){}
}
function setProg(p){ var b=$('#progbar'); if(b) b.style.width=Math.max(0,Math.min(100,p))+'%'; }
function setScore(s){ var e=$('#score'); if(e) e.textContent=s; }
function showPop(ok,html,src){
  var p=$('#pop'); p.className='pop '+(ok?'ok':'no');
  p.innerHTML='<b>'+(ok?'✔ 对了':'✘ 不对')+'</b><br>'+html+(src?'<span class="src">依据：'+src+'</span>':'');
}

function fmt(q,v){ return q.unit==='%' ? v+'%' : v+(q.unit||''); }
function render(){
  i=0; score=0; setScore(0); setProg(0); $('#done').style.display='none'; $('.card').style.display='block';
  show();
}
function show(){
  var q=QS[i];
  $('#q').innerHTML='<b>'+(i+1)+'. '+q.q+'</b><br><span style="color:#5a6472;font-size:13px">'+q.ask+'</span>';
  var r=$('#rng'); r.min=q.min; r.max=q.max; r.step=q.step||1; r.value=q.min;
  var pct=function(v){ return 100*(v-q.min)/(q.max-q.min); };
  var z=document.createRange?null:null;
  $('#zone').innerHTML='';
  var band=document.createElement('div');
  band.style.cssText='position:absolute;top:0;bottom:0;left:'+pct(q.lo)+'%;width:'+(pct(q.hi)-pct(q.lo))+'%;background:#2E7D32;opacity:.22';
  var mk=document.createElement('div'); mk.className='mark'; mk.style.left=pct(q.lo)+'%';
  var mk2=document.createElement('div'); mk2.className='mark'; mk2.style.left=pct(q.hi)+'%';
  var th=document.createElement('div'); th.className='thumb'; th.id='thumb';
  var cv=document.createElement('div'); cv.className='val'; cv.id='curval';
  $('#zone').append(band,mk,mk2,th,cv);
  $('#scale').innerHTML='<span>'+q.min+'</span><span>合格区 '+q.lo+'~'+q.hi+'</span><span>'+q.max+'</span>';
  setThumb();
  $('#ok').disabled=false;
  $('#pop').className='pop';
}
function setThumb(){
  var q=QS[i], r=$('#rng'), v=parseFloat(r.value);
  var pct=100*(v-q.min)/(q.max-q.min);
  var th=$('#thumb'), cv=$('#curval');
  if(th){ th.style.left=pct+'%'; }
  if(cv){ cv.style.left=pct+'%'; cv.textContent=fmt(q,v); }
  var inz = v>=q.lo && v<=q.hi;
  if(th) th.style.borderColor=inz?'#2E7D32':'#C62828';
}
$('#rng').oninput=setThumb;
$('#ok').onclick=function(){
  var q=QS[i], v=parseFloat($('#rng').value), inz=(v>=q.lo&&v<=q.hi);
  $('#ok').disabled=true;
  if(inz){ beep(true); score+=LVL; setScore(score);
    showPop(true,'调对了。'+(q.why||''),q.src||'');
  } else { beep(false);
    showPop(false,(v<q.lo?'调低了。':'调高了。')+(q.wrong||''),q.src||'');
  }
  i++; setProg(100*i/QS.length);
  $('#prog').textContent=i+' / '+QS.length;
  if(i>=QS.length){ setTimeout(finish,500); } else { setTimeout(show,500); }
};
function finish(){
  $('.card').style.display='none'; $('#done').style.display='block';
  $('#final').textContent=score+' 分';
  $('#comment').textContent = score>=24 ? '过关。判据数值记住了。' : '没过 24 分。把错的数值再看一遍，然后重来。';
}
$('#restart').onclick=render; $('#again').onclick=render;
render();
</script></body></html>
