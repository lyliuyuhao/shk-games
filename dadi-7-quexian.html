<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>缺陷定级打地鼠</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#eaf1ff;
  background:#08152b;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 18% 12%,rgba(58,130,255,.20),transparent 40%),
    radial-gradient(circle at 86% 80%,rgba(255,168,60,.14),transparent 44%),
    conic-gradient(from 210deg at 50% 50%,#0a1a33,#0e2444,#0a1a33);
  animation:slowspin 60s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:16px 14px 56px}
header{text-align:center;margin-bottom:8px}
h1{font-size:23px;letter-spacing:1.5px;background:linear-gradient(92deg,#8ec2ff,#ffd479 60%,#ff9e7d);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(120,180,255,.35))}
.sub{font-size:12.5px;color:#8aa6cd;margin-top:6px}
.hud{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.hud div{background:rgba(255,255,255,.06);border:1px solid rgba(140,180,255,.2);border-radius:11px;
  padding:6px 14px;font-size:13px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.hud b{color:#ffd479;font-size:15.5px;margin-left:3px}
.hud.hot b{color:#ff8b6b}
.acts{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
button{font-family:inherit;font-size:13.5px;padding:9px 20px;border-radius:10px;cursor:pointer;
  border:1.5px solid rgba(140,180,255,.38);background:rgba(255,255,255,.07);color:#dce8fb;
  transition:transform .15s,background .15s,border-color .15s,box-shadow .15s}
button:hover{background:rgba(127,182,255,.2);border-color:#7fb6ff;transform:translateY(-2px);box-shadow:0 8px 22px rgba(60,130,255,.35)}
button:active{transform:translateY(0) scale(.97)}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%) scale(.8);opacity:0;z-index:100;
  font-size:25px;font-weight:800;pointer-events:none;color:#ffd479;text-shadow:0 0 24px rgba(255,180,60,.95),0 3px 10px rgba(0,0,0,.6)}
#toast.show{animation:toast .9s cubic-bezier(.2,.9,.2,1)}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.18)}
  64%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1.28)}}
.over{position:fixed;inset:0;background:rgba(4,10,22,.9);display:none;align-items:center;justify-content:center;
  z-index:120;backdrop-filter:blur(8px)}
.over.show{display:flex;animation:fade .28s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:linear-gradient(165deg,#1a3355,#10213a);border:1.5px solid rgba(140,180,255,.3);
  border-radius:20px;padding:30px 38px;text-align:center;max-width:420px;
  box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1);animation:pop .34s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.panel h2{font-size:22px;margin-bottom:10px;background:linear-gradient(90deg,#8ec2ff,#ffd479);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.stars{font-size:36px;letter-spacing:7px;margin:12px 0;color:#ffd479;filter:drop-shadow(0 0 12px rgba(255,190,70,.8))}
.stars .off{color:#33445e;filter:none}
.panel p{font-size:13.5px;color:#a9c2e2;line-height:1.95}
.note{text-align:center;font-size:11.5px;color:#6b82a6;margin-top:24px;line-height:1.75}
.note a{color:#8ec2ff}

#arena{display:grid;gap:10px;justify-content:center;margin:0 auto}
.hole{position:relative;aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(ellipse at 50% 78%,#1a2d4a 0%,#0f1e35 62%,#0a1526 100%);
  border:2px solid rgba(110,160,235,.26);overflow:hidden;
  box-shadow:inset 0 14px 26px rgba(0,0,0,.75),inset 0 -3px 10px rgba(120,180,255,.12)}
.mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);
  width:82%;border-radius:13px;padding:7px 6px;text-align:center;cursor:pointer;
  font-size:11px;line-height:1.26;font-weight:700;
  transition:bottom .2s cubic-bezier(.2,1.5,.4,1),transform .12s;
  display:flex;align-items:center;justify-content:center;min-height:60%;
  box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28)}
.mole.up{bottom:9%}
.mole.good{background:linear-gradient(160deg,#2f7d4f,#1d5a37);border:1.5px solid #7dffb0;color:#e8fff2}
.mole.bad{background:linear-gradient(160deg,#8a3040,#5e1e2b);border:1.5px solid #ff8b8b;color:#ffeaea}
.mole:active{transform:translateX(-50%) scale(.94)}
.mole.hit{animation:hitx .3s forwards}
@keyframes hitx{0%{transform:translateX(-50%) scale(1)}45%{transform:translateX(-50%) scale(1.22)}
  100%{transform:translateX(-50%) scale(0);opacity:0}}
.mole.escape{transition:bottom .16s;bottom:-100%}
.hole.flash{animation:flashh .4s}
@keyframes flashh{0%,100%{box-shadow:inset 0 14px 26px rgba(0,0,0,.75)}50%{box-shadow:inset 0 14px 26px rgba(0,0,0,.75),0 0 0 4px rgba(255,140,140,.75)}}
#bar{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;max-width:560px;margin:4px auto 14px}
#bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7dffb0,#ffd479 55%,#ff7a7a);transition:width .3s}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:#8aa6cd;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
</style></head><body>
<canvas id="fx"></canvas>
<div class="wrap">
<header><h1>缺陷定级打地鼠</h1><div class="sub">项目7 缺陷查找与处理 ｜ 7.2 缺陷的定性与分级 ｜ 打地鼠（约 4 分钟）</div></header>
<div class="legend">
  <span><i class="dot" style="background:#2f7d4f"></i>正确项 → 打它</span>
  <span><i class="dot" style="background:#8a3040"></i>错误项 → 别打</span>
</div>
<div class="hud">
  <div>得分<b id="score">0</b></div>
  <div>连击<b id="combo">0</b></div>
  <div>命中率<b id="acc">—</b></div>
  <div class="hot">时间<b id="time">60</b></div>
</div>
<div id="bar"><i id="barIn"></i></div>
<div id="arena"></div>
<div class="acts"><button id="againBtn">重来</button></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》项目7 任务 7.2–7.9；GB 26860-2011<br>玩法：只打绿色（正确）的方块，红色（错误）的别打，打错扣分。越打越快来。</div>
</div>
<div class="over" id="over"><div class="panel">
  <h2 id="oT">时间到</h2><div class="stars" id="oS"></div><p id="oM"></p>
  <button onclick="location.reload()" style="margin-top:16px">再玩一次</button></div></div>
<div id="toast"></div>
<script>
var ITEMS=[{"t": "保护动作但断路器不跳 → 危急", "ok": true, "why": "直接导致保护失效，最严重", "src": "出版稿任务7.2"}, {"t": "CT 二次回路开路 → 危急", "ok": true, "why": "端子出现危险高电压", "src": "GB 26860-2011"}, {"t": "直流接地无法定位 → 严重", "ok": true, "why": "两点接地可能误动", "src": "出版稿任务7.9"}, {"t": "某相采样偏小 5% → 严重", "ok": true, "why": "先查回路，别怪仪表", "src": "出版稿任务7.5"}, {"t": "绝缘降到 0.4MΩ → 严重", "ok": true, "why": "低于支路门槛 1MΩ", "src": "出版稿任务7.4"}, {"t": "隔离开关闭锁失效 → 严重", "ok": true, "why": "可能带电误操作", "src": "出版稿任务7.3"}, {"t": "端子箱进水 → 严重", "ok": true, "why": "先排水除湿再测绝缘", "src": "出版稿任务7.4"}, {"t": "某信号点不刷新 → 一般", "ok": true, "why": "不影响保护动作", "src": "出版稿任务7.8"}, {"t": "端子轻微发热 → 一般", "ok": true, "why": "早期征兆，先跟踪", "src": "出版稿任务7.2"}, {"t": "采样偏小 → 是表坏了", "ok": false, "why": "最常见偷懒：把偏差归因仪表", "src": "出版稿任务7.5"}, {"t": "信号不刷新 → 装置坏了", "ok": false, "why": "先分软报文与硬接点两条路", "src": "出版稿任务7.8"}, {"t": "直流接地 → 不用管", "ok": false, "why": "两点接地会误动", "src": "出版稿任务7.9"}, {"t": "绝缘 0.4MΩ → 可以投运", "ok": false, "why": "低于门槛不能投", "src": "出版稿任务7.4"}, {"t": "闭锁失效 → 先操作再说", "ok": false, "why": "无闭锁操作是禁止项", "src": "出版稿任务7.3"}, {"t": "端子发热 → 等它烧了再说", "ok": false, "why": "发热是缺陷前兆", "src": "出版稿任务7.2"}, {"t": "保护不跳 → 换个断路器试试", "ok": false, "why": "先分清是保护还是回路", "src": "出版稿任务7.7"}];   // [{t:"方块文字", ok:true/false, why:"", src:""}]
var HOLES=12, DUR=60;

var $ = function(s){return document.querySelector(s)};
function beep(kind){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var cfg={click:[600,'sine',.05],ok:[880,'sine',.07],combo:[1240,'triangle',.08],
             bad:[160,'square',.1],win:[1320,'sine',.09],tick:[420,'sine',.04]}[kind]||[600,'sine',.05];
    var o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type=cfg[1];o.frequency.value=cfg[0];
    g.gain.setValueAtTime(.0001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(cfg[2],ac.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.26);
    o.start();o.stop(ac.currentTime+.3);
  }catch(e){}
}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}

/* 自写粒子系统（canvas），不依赖任何外部库 */
var FX=(function(){
  var cv,ctx,ps=[],raf=null;
  function init(){
    cv=document.getElementById('fx');
    if(!cv){cv=document.createElement('canvas');cv.id='fx';document.body.appendChild(cv)}
    cv.width=innerWidth;cv.height=innerHeight;ctx=cv.getContext('2d');
    addEventListener('resize',function(){cv.width=innerWidth;cv.height=innerHeight});
  }
  function burst(x,y,n,colors){
    colors=colors||['#ffd479','#8ec2ff','#7dffb0','#ff9e7d','#c9a8ff'];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
      ps.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,
        life:1,dec:.012+Math.random()*.016,
        c:colors[(Math.random()*colors.length)|0],
        r:2+Math.random()*3.4,rot:Math.random()*6,vr:(Math.random()-.5)*.3});
    }
    if(!raf) loop();
  }
  function loop(){
    raf=requestAnimationFrame(loop);
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=ps.length-1;i>=0;i--){
      var p=ps[i];
      p.vy+=.16;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;p.rot+=p.vr;
      if(p.life<=0){ps.splice(i,1);continue}
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2.4);
      ctx.restore();
    }
    if(!ps.length){cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,cv.width,cv.height)}
  }
  function rain(n){
    for(var i=0;i<n;i++){
      var x=Math.random()*innerWidth, y=-20-Math.random()*120;
      ps.push({x:x,y:y,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,life:1,dec:.006+Math.random()*.008,
        c:['#ffd479','#8ec2ff','#7dffb0','#ff9e7d','#c9a8ff','#ffffff'][(Math.random()*6)|0],
        r:2+Math.random()*3,rot:Math.random()*6,vr:(Math.random()-.5)*.35});
    }
    if(!raf) loop();
  }
  init();
  return {burst:burst,rain:rain};
})();

function starsHTML(n){var s='';for(var i=0;i<3;i++)s+= i<n?'<span class="star">★</span>':'<span class="off">★</span>';return s}
function fmtT(s){var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss}

var holes=[],score=0,combo=0,maxCombo=0,hit=0,miss=0,left=DUR,spawnT=null,clock=null,popMs=1250;

function build(){
  var a=$('#arena');
  a.style.gridTemplateColumns='repeat('+4+',minmax(0,1fr))';
  a.style.width='min(92vw,'+(4*140)+'px)';
  for(var i=0;i<HOLES;i++){
    var h=document.createElement('div');h.className='hole';
    var m=document.createElement('div');m.className='mole';
    h.appendChild(m);a.appendChild(h);
    holes.push({el:h,mole:m,busy:false,item:null});
  }
  clock=setInterval(tick,1000);
  spawn();
}
function tick(){
  left--;$('#time').textContent=left;
  $('#barIn').style.width=Math.max(0,left/DUR*100)+'%';
  if(left<=0)end();
  if(left%(DUR>40?12:8)===0)popMs=Math.max(620,popMs-140);   // 越来越快
}
function spawn(){
  spawnT=setTimeout(spawn,Math.max(420,popMs*0.62));
  var free=holes.filter(function(h){return !h.busy});
  if(!free.length)return;
  var h=free[(Math.random()*free.length)|0];
  var it=ITEMS[(Math.random()*ITEMS.length)|0];
  h.busy=true;h.item=it;
  h.mole.textContent=it.t;
  h.mole.className='mole '+(it.ok?'good':'bad');
  requestAnimationFrame(function(){h.mole.classList.add('up')});
  var stay=it.ok?popMs:popMs*1.15;
  h.timer=setTimeout(function(){retreat(h,false)},stay);
}
function retreat(h,wasHit){
  if(!h.busy)return;
  clearTimeout(h.timer);
  h.mole.classList.remove('up');
  h.busy=false;h.item=null;
  setTimeout(function(){h.mole.className='mole'},230);
}
document.addEventListener('click',function(e){
  var m=e.target.closest?e.target.closest('.mole'):null;
  if(!m)return;
  var h=holes.filter(function(x){return x.mole===m})[0];
  if(!h||!h.busy)return;
  var it=h.item, r=m.getBoundingClientRect();
  if(it.ok){
    hit++;combo++;maxCombo=Math.max(maxCombo,combo);
    var gain=10+Math.min(20,(combo-1)*3);
    score+=gain;$('#score').textContent=score;$('#combo').textContent=combo;
    m.classList.add('hit');
    FX.burst(r.x+r.width/2,r.y+r.height/2,18);
    beep(combo>=3?'combo':'ok');
    if(combo>=3)toast('连击 ×'+combo);
    if(it.why&&combo<3)toast('✓ '+it.why.slice(0,16));
    h.busy=false;h.item=null;
    setTimeout(function(){m.className='mole'},320);
  }else{
    miss++;combo=0;
    score=Math.max(0,score-8);$('#score').textContent=score;$('#combo').textContent='0';
    h.el.classList.add('flash');
    beep('bad');
    if(it.why)toast('✗ '+it.why.slice(0,16));
    retreat(h,true);
    setTimeout(function(){h.el.classList.remove('flash')},420);
  }
  updAcc();
});
function updAcc(){
  var tot=hit+miss;
  $('#acc').textContent=tot?Math.round(hit/tot*100)+'%':'—';
}
function end(){
  clearInterval(clock);clearTimeout(spawnT);
  holes.forEach(function(h){clearTimeout(h.timer);retreat(h,false)});
  var st=score>=280?3:(score>=180?2:(score>=90?1:0));
  $('#oT').textContent=score>=180?'打得不错！':'再来一局';
  $('#oS').innerHTML=starsHTML(st);
  $('#oM').innerHTML='得分 '+score+' ｜ 命中 '+hit+' ｜ 打错 '+miss+' ｜ 最高连击 '+maxCombo+
    '<br>'+(st>=2?'判据记得住，才打得准。':'先看清绿色说的是不是对的，再动手。');
  $('#over').classList.add('show');
  if(st>=2){beep('win');FX.rain(110)}else beep('bad');
}
$('#againBtn').onclick=function(){location.reload()};
build();
</script></body></html>
