<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>信号回路调试 · 信号类型与后台表现连线</title>
<style>
:root{--blue:#0B3D91;--orange:#F5A623;--green:#2E7D32;--red:#C62828;--ink:#2B2F36;--bg:#F5F7FA;}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}
header{background:linear-gradient(135deg,#0B3D91,#1a56b8);color:#fff;border-radius:10px;padding:20px 24px;margin-bottom:16px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border:10px solid rgba(255,255,255,.10);border-radius:50%}
header h1{margin:0;font-size:21px}
header p{margin:7px 0 0;font-size:13px;opacity:.88}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px}
.pill{background:#fff;border:1px solid #dfe5ee;border-radius:999px;padding:4px 13px}
.pill b{color:var(--blue)}
.prog{height:7px;background:#e6ecf5;border-radius:999px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0B3D91,#2E7D32);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.card{background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 2px 10px rgba(11,61,145,.08)}
.hint{background:#FFF7E6;border-left:4px solid var(--orange);padding:9px 13px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:10px 24px;font-size:14.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.center{text-align:center}
.pop{display:none;margin-top:14px;border-radius:8px;padding:13px 15px;font-size:14px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pop.ok{display:block;background:#EDF7EE;border-left:4px solid var(--green)}
.pop.no{display:block;background:#FDECEC;border-left:4px solid var(--red)}
.pop .src{display:block;margin-top:6px;font-size:12.5px;color:#5a6472}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .35s}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.55)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.glow{animation:glow .7s ease-out 2}
.end{display:none}
.score{font-size:38px;color:var(--blue);font-weight:700;margin:8px 0}
.note{margin-top:24px;font-size:12px;color:#6b7280;border-top:1px dashed #d7dee8;padding-top:10px}

.board{position:relative;display:flex;justify-content:space-between;gap:40px;margin:10px 0 6px}
.col{flex:1;display:flex;flex-direction:column;gap:14px;z-index:2}
.node{background:#fff;border:2px solid #dfe5ee;border-radius:9px;padding:12px 14px;font-size:14px;cursor:grab;transition:.18s;position:relative}
.node:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 4px 12px rgba(11,61,145,.15)}
.node.sel{border-color:var(--orange);background:#FFF9EE;box-shadow:0 0 0 3px rgba(245,166,35,.25)}
.node.done{border-color:var(--green);background:#EDF7EE;cursor:default;opacity:.9}
.node.bad{animation:shake .35s;border-color:var(--red);background:#FDECEC}
svg.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
svg.lines path{fill:none;stroke-width:3;stroke-linecap:round}
svg.lines path.tmp{stroke:var(--orange);stroke-dasharray:8 6;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
</style></head><body><div class="wrap">
<header><h1>信号回路调试 · 信号类型与后台表现连线</h1><p>项目5 二次回路调试 ｜ 5.6 信号回路调试 ｜ 连线配对（约 4 分钟）</p></header>
<div class="bar"><span class="pill">进度 <b id="prog">0 / 6</b></span><span class="pill">得分 <b id="score">0</b></span><span class="pill">满分 <b>60</b></span></div>
<div class="prog"><i id="progbar"></i></div>
<div class="card">
  <p class="hint">玩法：点左边一项，再点右边与它对应的一项，就会连上一条线。连错线会抖一下并扣分。</p>
  <div class="board">
    <svg class="lines" id="svg"></svg>
    <div class="col" id="left"></div>
    <div class="col" id="right"></div>
  </div>
  <div class="pop" id="pop"></div>
  <div class="actions" style="margin-top:16px"><button class="btn ghost" id="restart">重来</button></div>
</div>
<div class="card end" id="done"><div class="center"><div class="score" id="final">0</div><p id="comment"></p><button class="btn" id="again" style="margin-top:10px">再练一次</button></div></div>
<div class="note">[AI起草·待人工核定] 判据依据：出版稿《二次回路设计与安装调试》任务 5.5（信号回路调试）；DL/T 1879-2018；DL/T 5136-2012。本页仅作课堂练习，不作考核依据。</div>
</div><script>
var PAIRS=[{"l": "事故信号", "r": "一次系统事故引起断路器跳闸时发出的声、光信号", "why": "事故信号的判据是瞬时音响、来源明确。", "src": "出版稿任务5.5「信号回路的设计判据」"}, {"l": "预告信号", "r": "设备出现不正常运行状态时发出的声、光信号", "why": "预告信号分瞬时与延时两类。", "src": "出版稿任务5.5"}, {"l": "位置信号", "r": "表示断路器、隔离开关等开关设备状态的信号", "why": "红灯亮表示合闸状态，同时表明跳闸回路完好。", "src": "出版稿任务5.5"}, {"l": "遥信变位正确", "r": "状态与输入一致、变位后着色、闪烁", "why": "监控主机显示的遥信状态与输入状态一致，且变位后正确启动告警、状态变位着色、闪烁。", "src": "DL/T 1879-2018 第 8.5.1.5 条 b) 款"}, {"l": "远方复归合格", "r": "后台光字与装置告警两头都要掉", "why": "监控主机光字牌或告警信号与装置告警信号均应复归。", "src": "DL/T 1879-2018 第 8.5.1.9 条 b) 款"}, {"l": "重要信号", "r": "应通过硬接线方式实现", "why": "通信方式应保证实时性与可靠性，但重要信号必须硬接线。", "src": "DL/T 5136-2012 第 5.2.1 条"}];
var LVL=10, cur=0, score=0, selLeft=null, matched={};

function $(s){return document.querySelector(s)}
function $$(s){return [...document.querySelectorAll(s)]}
function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    window.__AC=window.__AC||new C(); var ac=window.__AC;
    var o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok?880:180; o.type = ok?'sine':'square';
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(ok?.08:.12,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(ok?.22:.30));
    o.start(); o.stop(ac.currentTime+(ok?.24:.32));
  }catch(e){}
}
function setProg(p){ var b=$('#progbar'); if(b) b.style.width=Math.max(0,Math.min(100,p))+'%'; }
function setScore(s){ var e=$('#score'); if(e) e.textContent=s; }
function showPop(ok,html,src){
  var p=$('#pop'); p.className='pop '+(ok?'ok':'no');
  p.innerHTML='<b>'+(ok?'✔ 对了':'✘ 不对')+'</b><br>'+html+(src?'<span class="src">依据：'+src+'</span>':'');
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function nodeEl(txt,side,idx){
  var d=document.createElement('div'); d.className='node'; d.textContent=txt;
  d.dataset.side=side; d.dataset.idx=idx;
  d.addEventListener('click',function(){ pick(d,side,idx); });
  return d;
}
function render(){
  var L=$('#left'), R=$('#right'); L.innerHTML=''; R.innerHTML='';
  matched={}; selLeft=null; cur=0; score=0; setScore(0); setProg(0); $('#done').style.display='none';
  $('.card').style.display='block';
  var lf=PAIRS.map(function(p,i){return i;});
  var rt=shuffle(PAIRS.map(function(p,i){return i;}));
  lf.forEach(function(i){ L.appendChild(nodeEl(PAIRS[i].l,'L',i)); });
  rt.forEach(function(i){ R.appendChild(nodeEl(PAIRS[i].r,'R',i)); });
  $('#prog').textContent='0 / '+PAIRS.length;
  $('#svg').innerHTML='';
}
function pick(el,side,idx){
  if(el.classList.contains('done')) return;
  if(side==='L'){
    $$('.node.sel').forEach(function(n){n.classList.remove('sel');});
    el.classList.add('sel'); selLeft={el:el,idx:idx};
    return;
  }
  if(!selLeft){ showPop(false,'先点左边一项，再点右边。'); return; }
  var l=selLeft, r={el:el,idx:idx};
  if(l.idx===r.idx){
    beep(true);
    l.el.classList.add('done'); l.el.classList.remove('sel'); r.el.classList.add('done');
    l.el.classList.add('glow'); r.el.classList.add('glow');
    drawLine(l.el,r.el,true);
    matched[l.idx]=1; cur++; score+=LVL; setScore(score);
    $('#prog').textContent=cur+' / '+PAIRS.length;
    setProg(100*cur/PAIRS.length);
    showPop(true,PAIRS[l.idx].why||'配对正确。',PAIRS[l.idx].src||'');
    selLeft=null;
    if(cur===PAIRS.length) finish();
  } else {
    beep(false);
    el.classList.add('bad'); l.el.classList.add('bad');
    setTimeout(function(){ el.classList.remove('bad'); l.el.classList.remove('bad'); },400);
    drawLine(l.el,el,false);
    setTimeout(function(){ var p=$('#svg path.tmp'); if(p)p.remove(); },600);
    showPop(false,(PAIRS[r.idx].wrong||'这一对不成立。')+(PAIRS[r.idx].why?('<br>'+PAIRS[r.idx].why):''),PAIRS[r.idx].src||'');
    selLeft=null;
    $$('.node.sel').forEach(function(n){n.classList.remove('sel');});
  }
}
function drawLine(a,b,keep){
  var svg=$('#svg'), ab=a.getBoundingClientRect(), bb=b.getBoundingClientRect(), sb=svg.getBoundingClientRect();
  var x1=ab.right-sb.left, y1=ab.top-sb.top+ab.height/2;
  var x2=bb.left-sb.left, y2=bb.top-sb.top+bb.height/2;
  var p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M'+x1+','+y1+' C'+(x1+40)+','+y1+' '+(x2-40)+','+y2+' '+x2+','+y2);
  p.setAttribute('stroke', keep?'#2E7D32':'#C62828');
  if(!keep) p.classList.add('tmp');
  svg.appendChild(p);
}
function finish(){
  setTimeout(function(){
    $('.card').style.display='none'; $('#done').style.display='block';
    $('#final').textContent=score+' 分';
    $('#comment').textContent = score>=36 ? '过关。配对关系记住了，可以上真设备。' : '没过 36 分。把错的那几对再想一遍，然后重来。';
  },620);
}
$('#restart').onclick=render; $('#again').onclick=render;
render();
</script></body></html>
